name: Validar contribuciones

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      COMMIT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Comprobar versiones
        shell: bash
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git hash-object -t tree -w --stdin < /dev/null)
          fi
          npm run check:versions -- --base "$BASE_SHA"
      - name: Validar mensajes de commit
        if: ${{ !startsWith(env.BASE_SHA, '0000000') }}
        run: npx --no -- commitlint --from "$BASE_SHA" --to "$COMMIT_HEAD" --verbose
      - name: Validar catálogo y plugins
        shell: bash
        run: |
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.322 -- claude plugin validate .
          for plugin in plugins/*/; do
            [ -d "$plugin" ] || continue
            npm exec --yes --package=@anthropic-ai/claude-code@2.1.322 -- claude plugin validate "$plugin"
          done
      - run: npm test
